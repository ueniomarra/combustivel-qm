<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Vistoria QM"/>
<meta name="theme-color" content="#0A1628"/>
<title>Vistoria QM – Queiroz Marra</title>
<link rel="manifest" href="manifest.json"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;background:#F0F4F8}
body{font-family:'SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px}
input,select,textarea,button{font-family:inherit}
#root{max-width:430px;margin:0 auto;min-height:100vh}

/* tabbar */
#tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;
  background:rgba(255,255,255,.97);backdrop-filter:blur(20px);border-top:1px solid #E5E7EB;
  display:flex;z-index:200;padding-bottom:env(safe-area-inset-bottom,0)}
.tab-btn{flex:1;background:none;border:none;padding:12px 0;cursor:pointer;display:flex;
  flex-direction:column;align-items:center;gap:3px}
.tab-ico{font-size:20px}
.tab-lbl{font-size:10px;font-weight:800}

/* fab */
#fab-wrap{position:fixed;bottom:28px;right:16px;z-index:1000;display:flex;
  flex-direction:column;align-items:flex-end;gap:10px}
#fab-menu{display:none;flex-direction:column;gap:10px;align-items:flex-end}
.fab-btn{width:54px;height:54px;border-radius:27px;border:none;color:#fff;font-size:22px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 20px rgba(0,0,0,.3);transition:all .2s}
#fab-overlay{position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.25);
  backdrop-filter:blur(2px);display:none}

/* geral */
.screen{min-height:100vh;padding-bottom:80px;background:#F0F4F8}
.hdr{background:linear-gradient(160deg,#0A1628 0%,#1B4332 60%,#2D6A4F 100%);
  padding:48px 16px 24px;color:#fff;border-bottom-left-radius:24px;border-bottom-right-radius:24px}
.hdr-sm{border-radius:0;padding:48px 16px 20px}
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;
  border:1px solid #E5E7EB;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.lbl{font-size:11px;font-weight:700;color:#374151;margin-bottom:4px;letter-spacing:.3px;display:block}
.inp{width:100%;border:1.5px solid #D1D5DB;border-radius:10px;padding:11px 14px;
  font-size:14px;color:#111827;background:#fff;box-sizing:border-box;outline:none;
  font-family:inherit}
textarea.inp{resize:vertical}
.fld{margin-bottom:14px}
.btn{width:100%;border:none;border-radius:14px;padding:15px;font-size:16px;
  font-weight:800;cursor:pointer;color:#fff}
.pb{background:#E5E7EB;border-radius:99px;height:5px;overflow:hidden}
.pb-fill{height:100%;border-radius:99px;transition:width .4s}
.badge{display:inline-block;font-size:10px;font-weight:800;padding:3px 8px;border-radius:99px;letter-spacing:.3px}

/* checklist item */
.ci{background:#fff;border-radius:12px;padding:14px;margin-bottom:10px;
  border:1px solid #E5E7EB;border-left-width:4px}
.ci-c{background:#F0FDF4;border-color:#10B981}
.ci-nc{background:#FFF5F5;border-color:#EF4444}
.ci-na{background:#F9FAFB;border-color:#9CA3AF}
.ci-text{font-size:13px;color:#1F2937;font-weight:500;line-height:1.55;margin-bottom:10px}
.ci-btns{display:flex;gap:5px;margin-bottom:8px}
.ci-btn{flex:1;border:none;border-radius:8px;padding:8px 4px;font-size:11px;font-weight:800;cursor:pointer}
.ci-nota{width:100%;border:1.5px solid #D1D5DB;border-radius:10px;padding:11px 14px;
  font-size:13px;color:#111827;background:#fff;box-sizing:border-box;font-family:inherit;
  resize:vertical;outline:none}
</style>
</head>
<body>
<div id="root"></div>
<div id="tabbar">
  <button class="tab-btn" id="tb-home" onclick="goTab('home')">
    <span class="tab-ico">🏠</span><span class="tab-lbl" style="color:#1B4332">Início</span>
  </button>
  <button class="tab-btn" id="tb-hist" onclick="goTab('hist')">
    <span class="tab-ico">📁</span><span class="tab-lbl" style="color:#9CA3AF">Histórico</span>
  </button>
</div>
<div id="fab-overlay" onclick="closeFab()"></div>
<div id="fab-wrap" style="display:none">
  <div id="fab-menu">
    <button onclick="goHome()" style="background:#1B4332;color:#fff;border:none;border-radius:50px;
      padding:12px 20px;font-size:13px;font-weight:800;cursor:pointer;
      box-shadow:0 4px 14px rgba(0,0,0,.25);white-space:nowrap">🏠 Página Inicial</button>
  </div>
  <button class="fab-btn" id="fab-btn" onclick="toggleFab()">☰</button>
</div>

// LS
function lsGet(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
function loadLocal(){

}

// Firebase
async function initFB(){
  if(!navigator.onLine)return;
  try{
    const{initializeApp}=await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
    const{getFirestore,collection,addDoc,getDocs,query,orderBy,deleteDoc,doc}=
      await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
    const app=initializeApp(FB_CFG);
    G.db=getFirestore(app);G.fsOk=true;
    window._fs={collection,addDoc,getDocs,query,orderBy,deleteDoc,doc};
    await syncFS();
  }catch(e){console.warn('Firebase offline')}
}
async function syncFS(){
  if(!G.db||!window._fs)return;
  try{
    const{collection,getDocs,query,orderBy}=window._fs;
    const snap=await getDocs(query(collection(G.db,'vistorias'),orderBy('ts','asc')));
    const remote=snap.docs.map(d=>({...d.data(),_fsId:d.id}));
    const ids=new Set(G.historico.filter(v=>v._fsId).map(v=>v._fsId));
    let added=0;
    remote.forEach(r=>{if(!ids.has(r._fsId)){G.historico.push(r);added++}});
    if(added>0){saveHistorico();render()}
  }catch(e){}
}
async function saveFS(v){
  if(!G.db||!window._fs)return;
  try{
    const{collection,addDoc}=window._fs;
    const ref=await addDoc(collection(G.db,'vistorias'),{...v,ts:Date.now()});
    const idx=G.historico.indexOf(v);
    if(idx>=0){G.historico[idx]._fsId=ref.id;saveHistorico()}
  }catch(e){}
}
async function deleteFS(fsId){
  if(!G.db||!window._fs||!fsId)return;
  try{const{doc,deleteDoc}=window._fs;await deleteDoc(doc(G.db,'vistorias',fsId))}catch(e){}
}

function h(s){return String(s??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function fld(lbl,inp,ref){
  return `<div class="fld"><label class="lbl">${lbl}</label>${inp}${ref?`<div style="font-size:10px;color:#9CA3AF;margin-top:3px;">${ref}</div>`:''}</div>`
}
function slt(opts,val,ev){
  return `<select class="inp" onchange="${ev}">${opts.map(o=>{
    const v=typeof o==='string'?o:o.val;const l=typeof o==='string'?o:o.label;
    return `<option value="${h(v)}"${val===v?' selected':''}>${h(l)}</option>`;
  }).join('')}</select>`
}
function pbHTML(v,color){
  return `<div class="pb"><div class="pb-fill" style="width:${Math.min(100,v||0)}%;background:${color}"></div></div>`
}
function ringHTML(pct,color,size=96,stroke=8){
  const r=(size-stroke*2)/2,ci=2*Math.PI*r,off=ci-(pct/100)*ci;
  return `<svg width="${size}" height="${size}" style="transform:rotate(-90deg)">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#E5E7EB" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}"
      stroke-dasharray="${ci.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" stroke-linecap="round"/>
  </svg>`
}
function logoQM(maxW=180,white=false,center=false){
  return `<div style="display:inline-block;max-width:${maxW}px;text-align:${center?'center':'left'};
    background:${white?'rgba(255,255,255,.92)':'transparent'};
    border-radius:${white?8:0}px;padding:${white?'4px 10px':'0'}">
    <img src="${LOGO_QM_B64}" alt="Queiroz Marra"
      style="max-width:100%;height:auto;display:block;border-radius:4px"/>
  </div>`
}
function corIndice(v){return v>=85?'#10B981':v>=60?'#F59E0B':'#EF4444'}
function lblIndice(v){return v>=85?'CONFORME':v>=60?'ATENÇÃO':'NÃO CONFORME'}
function calcIndice(modId,resps){
  const todos=Object.values(CHECKLIST[modId]||{}).flat();
  const aval=todos.filter(i=>resps[i.id]==='C'||resps[i.id]==='NC');
  const conf=aval.filter(i=>resps[i.id]==='C');
  return aval.length>0?Math.round(conf.length/aval.length*100):0;
}

function finalizarVistoria(){
  const indice=calcIndice(G.modSel,G.respostas);
  const v={modId:G.modSel,meta:{...G.meta},respostas:{...G.respostas},
    notas:{...G.notas},conclusao:{...G.conclusao},quant:{...G.quant},indice,ts:Date.now()};
  G.historico.push(v);saveHistorico();saveFS(v);
  goHome();

function excluirVistoria(idx){
  if(!confirm('Excluir esta vistoria?'))return;
  const v=G.historico[idx];
  if(v?._fsId)deleteFS(v._fsId);
  G.historico.splice(idx,1);saveHistorico();render();
}
function exportBackup(){
  const data=JSON.stringify({cidades:G.cidades,historico:G.historico,exportedAt:new Date().toISOString()},null,2);
  const blob=new Blob([data],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=`qm-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();
  URL.revokeObjectURL(url);
}
function importBackup(input){
  const file=input.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=ev=>{try{const d=JSON.parse(ev.target.result);
    if(d.historico)G.historico=d.historico;if(d.cidades)G.cidades=d.cidades;
    saveHistorico();saveCidades();alert('Backup importado!');render()
  }catch{alert('Arquivo inválido')}};
  r.readAsText(file);input.value='';
}

function render(){
  const root=document.getElementById('root');
  const tabbar=document.getElementById('tabbar');

  // Overlay relatório histórico
  if(G.histViewIdx!==null&&G.historico[G.histViewIdx]){
    tabbar.style.display='none';
    root.innerHTML=buildRelatorio(G.historico[G.histViewIdx],true);
    window.scrollTo(0,0);return;
  }
  if(G.histViewIdx!==null)G.histViewIdx=null;

  if(G.tela==='vistoria'){
    tabbar.style.display='none';root.innerHTML=buildVistoria();window.scrollTo(0,0);return;
  }
  if(G.tela==='relatorio'){
    tabbar.style.display='none';
    const v={modId:G.modSel,meta:G.meta,respostas:G.respostas,notas:G.notas,
      conclusao:G.conclusao,quant:G.quant,indice:calcIndice(G.modSel,G.respostas)};
    root.innerHTML=buildRelatorio(v,false);window.scrollTo(0,0);return;
  }
  if(G.tela==='gerenciar'){
    tabbar.style.display='none';
    document.getElementById('fab-wrap').style.display='none';
    root.innerHTML=buildGerenciar();window.scrollTo(0,0);return;
  }
  tabbar.style.display='flex';
  root.innerHTML=G.tab==='home'?buildHome():buildHistorico();
  window.scrollTo(0,0);
}

function salvarCidades(){

  G.cidades.forEach((c,i)=>{

     'cnpj_pref','empreendedor_nome','tel_pref','email_pref','gerenciador','cnpj_sema',
     'tel_sema','email_sema','secretario'].forEach(k=>{
      const el=document.getElementById(`cn${i}${k}`);
      if(el)G.cidades[i][k]=nf.includes(k)?(parseFloat(el.value)||0):el.value;
    });

async function buscarIBGE(i){
  const c=G.cidades[i];
  const nome=(document.getElementById(`cn${i}nome`)?.value||c.nome||'').trim();
  const uf=(document.getElementById(`cn${i}uf`)?.value||c.uf||'GO').trim().toUpperCase();
  const msg=el=>document.getElementById(`ibgem${i}`);
  const btn=document.getElementById(`ibge${i}`);
  const msgEl=document.getElementById(`ibgem${i}`);
  if(!nome){ibgeMsg(msgEl,'⚠️ Digite o nome do município primeiro.','warn');return}
  btn.textContent='⏳ Buscando...';btn.disabled=true;
  ibgeMsg(msgEl,'🔍 Buscando no IBGE...','info');
  try{
    const r1=await fetch('https://servicodados.ibge.gov.br/api/v1/localidades/municipios?orderBy=nome');
    const todos=await r1.json();
    const nm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
    const match=todos.find(m=>nm(m.nome)===nm(nome)&&(!uf||m.microrregiao?.mesorregiao?.UF?.sigla===uf))
      ||todos.find(m=>nm(m.nome)===nm(nome));
    if(!match){ibgeMsg(msgEl,'❌ Município não encontrado no IBGE.','err');btn.textContent='🔍 Buscar via IBGE + GPS';btn.disabled=false;return}
    const cod=match.id,ufS=match.microrregiao?.mesorregiao?.UF?.sigla||'';
    ibgeMsg(msgEl,'📊 Buscando população e área...','info');
    let popT=0,area=0,lat='',lng='';
    try{const r2=await fetch(`https://servicodados.ibge.gov.br/api/v3/agregados/4709/periodos/2022/variaveis/93?localidades=N6[${cod}]`);
      const d2=await r2.json();popT=parseInt(d2?.[0]?.resultados?.[0]?.series?.[0]?.serie?.['2022'])||0}catch{}
    try{const r3=await fetch(`https://servicodados.ibge.gov.br/api/v3/agregados/1301/periodos/2022/variaveis/614?localidades=N6[${cod}]`);
      const d3=await r3.json();area=parseFloat(d3?.[0]?.resultados?.[0]?.series?.[0]?.serie?.['2022'])||0}catch{}
    ibgeMsg(msgEl,'🌍 Buscando coordenadas GPS...','info');
    try{const r5=await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(nome+', '+ufS+', Brazil')}&format=json&limit=1`,{headers:{'Accept-Language':'pt-BR'}});
      const d5=await r5.json();if(d5?.[0]){lat=parseFloat(d5[0].lat).toFixed(6);lng=parseFloat(d5[0].lon).toFixed(6)}}catch{}
    const upd=(k,v)=>{const el=document.getElementById(`cn${i}${k}`);if(el)el.value=v};
    upd('uf',ufS);upd('cod_ibge',cod);upd('pop_total',popT);upd('pop_urbana',Math.round(popT*0.75));
    upd('area_km2',area);upd('lat_cidade',lat);upd('lng_cidade',lng);
    ibgeMsg(msgEl,`✅ Pop: ${popT.toLocaleString('pt-BR')} hab · ${area?area.toFixed(1)+' km²':''} · GPS: ${lat||'—'}, ${lng||'—'}`,'ok');
  }catch(e){ibgeMsg(msgEl,'❌ Erro. Verifique a conexão.','err')}
  btn.textContent='🔍 Buscar via IBGE + GPS';btn.disabled=false;
}
function ibgeMsg(el,msg,t){
  if(!el)return;
  const c={info:['#EFF6FF','#BFDBFE'],ok:['#F0FDF4','#BBF7D0'],warn:['#FFFBEB','#FDE68A'],err:['#FEF2F2','#FECACA']}[t]||['#EFF6FF','#BFDBFE'];
  el.style.display='block';el.style.background=c[0];el.style.border=`1px solid ${c[1]}`;el.textContent=msg;
}

function autoRT(){
  const m=G.meta;if(m._rtManual)return m.numero_relatorio||'';
  const c=G.cidades.find(x=>x.id===m.cidadeId);
  if(!c||!m.data)return '';
  const mun=(c.nome||'').substring(0,6).toUpperCase().replace(/\s/g,'');
  const ano=(m.data||'').substring(0,4)||new Date().getFullYear();
  return `RT-${c.uf||'GO'}-${mun}-${ano}-${String(m.numero_visita||1).padStart(3,'0')}`;
}

function buildChecklistSecao(mod,secao,secaoIdx){
  const itens=CHECKLIST[mod.id]?.[secao]||[];
  const resp=itens.filter(i=>G.respostas[i.id]).length;
  const conf=itens.filter(i=>G.respostas[i.id]==='C').length;
  const nc=itens.filter(i=>G.respostas[i.id]==='NC').length;
  const pct=itens.length?Math.round(resp/itens.length*100):0;

  const itemsHTML=itens.map(item=>{
    const r=G.respostas[item.id];
    const nota=G.notas[item.id]||'';

function setResp(id,v){
  if(G.respostas[id]===v)delete G.respostas[id];else G.respostas[id]=v;
  const el=document.getElementById(`ci-${id}`);
  if(!el)return;
  el.className='ci'+(v==='C'&&G.respostas[id]?' ci-c':v==='NC'&&G.respostas[id]?' ci-nc':v==='NA'&&G.respostas[id]?' ci-na':'');
  el.querySelectorAll('.ci-btn').forEach(b=>{
    const bv=b.dataset.v;
    const c=bv==='C'?'#10B981':bv==='NC'?'#EF4444':'#9CA3AF';
    b.style.background=G.respostas[id]===bv?c:'#F3F4F6';
    b.style.color=G.respostas[id]===bv?'#fff':'#6B7280';
  });
  // Mostrar/ocultar textarea
  const ta=el.querySelector('.ci-nota');
  const r=G.respostas[id];
  if(r&&!ta){
    const nota=G.notas[id]||'';
    const div=document.createElement('textarea');
    div.className='ci-nota';div.rows=r==='NC'?3:2;
    div.placeholder=r==='NC'?'📝 Descreva: o que foi observado, causa provável, risco associado e ação corretiva recomendada...':'📝 Observação opcional...';
    div.value=nota;div.onchange=()=>{G.notas[id]=div.value};
    el.appendChild(div);
  }else if(!r&&ta){ta.remove()}
  // Atualiza header
  const secao=G.secoes[G.etapa-1];
  const itens=CHECKLIST[G.modSel]?.[secao]||[];
  const rsp=itens.filter(i=>G.respostas[i.id]).length;
  const cf=itens.filter(i=>G.respostas[i.id]==='C').length;
  const nc=itens.filter(i=>G.respostas[i.id]==='NC').length;
  const pct=itens.length?Math.round(rsp/itens.length*100):0;
  const pb=document.getElementById('hdr-pb');if(pb)pb.style.width=pct+'%';
  const st=document.getElementById('hdr-stats');if(st)st.textContent=`${rsp}/${itens.length} avaliados`;
}

function buildHistorico(){
  const hist=G.historico;
  const cf=G.cidFiltro;
  const cidNome=cf?G.cidades.find(c=>c.id===cf)?.nome:null;
  const listaIdx=hist.map((v,i)=>({...v,_oi:i})).reverse();
  const lista=cf?listaIdx.filter(v=>v.meta?.cidadeId===cf):listaIdx;

  const rows=lista.map(v=>{
    const mod=MODULOS[v.modId]||{};
    const cid=G.cidades.find(c=>c.id===v.meta?.cidadeId);
    const mun=cid?.nome||v.meta?.municipio_manual||v.meta?.area||'—';
    const ci=corIndice(v.indice);
    const ant=hist.slice(0,v._oi).reverse().find(x=>{
      const c2=G.cidades.find(c=>c.id===x.meta?.cidadeId);
      return x.modId===v.modId&&(c2?.nome||x.meta?.municipio_manual||x.meta?.area)===mun;
    });
    const ev=ant!=null?(v.indice-ant.indice):null;
    return`<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div style="flex:1">
          <div style="font-size:15px;font-weight:800;color:#111827">${mod.icon||''} ${mod.label||v.modId}</div>
          <div style="font-size:13px;color:#374151;font-weight:700;margin-top:2px">${mun}</div>
          <div style="font-size:11px;color:#9CA3AF;margin-top:1px">${v.meta?.data||''}${v.meta?.numero_relatorio?' · '+v.meta.numero_relatorio:''}</div>
          ${(v.meta?.tecnicos||[]).filter(t=>t.nome).length?`<div style="font-size:11px;color:#9CA3AF">${(v.meta.tecnicos||[]).filter(t=>t.nome).map(t=>t.nome).join(' · ')}</div>`:''}
          ${v.conclusao?.status?`<div style="margin-top:6px;font-size:11px;font-weight:700;color:#6B7280">${v.conclusao.status}</div>`:''}
          ${ev!==null?`<div style="margin-top:5px;font-size:11px;font-weight:700;color:${ev>=0?'#10B981':'#EF4444'}">${ev>=0?'↑':'↓'} ${Math.abs(ev)}% vs anterior (${ant.indice}% → ${v.indice}%)</div>`:''}
        </div>
        <div style="text-align:right;flex-shrink:0;margin-left:12px">
          <div style="font-size:26px;font-weight:900;color:${ci}">${v.indice}%</div>
          <div style="font-size:9px;color:#9CA3AF;margin-bottom:8px">conformidade</div>
          <button onclick="G.histViewIdx=${v._oi};render()" style="background:#1B4332;color:#fff;border:none;border-radius:8px;padding:6px 12px;font-size:11px;font-weight:800;cursor:pointer;display:block;margin-bottom:6px;width:100%">📄 Ver</button>
          <button onclick="excluirVistoria(${v._oi})" style="background:#FEE2E2;color:#DC2626;border:none;border-radius:8px;padding:5px 10px;font-size:10px;font-weight:700;cursor:pointer;display:block;width:100%">✕ Excluir</button>
        </div>
      </div>
    </div>`;
  }).join('');

  return`<div class="screen">
  <div class="hdr hdr-sm">
    ${logoQM(160,true)}
    <div style="font-size:18px;font-weight:900;margin-top:12px">📁 Histórico de Vistorias</div>
    <div style="font-size:11px;opacity:.75;margin-top:4px">${hist.length} vistoria(s) armazenada(s) localmente</div>
    <div style="display:flex;gap:8px;margin-top:14px">
      <button onclick="exportBackup()" style="background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:20px;padding:6px 14px;font-size:11px;font-weight:700;cursor:pointer">⬇ Exportar backup</button>
      <label style="background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:20px;padding:6px 14px;font-size:11px;font-weight:700;cursor:pointer">
        ⬆ Importar backup<input type="file" accept=".json" style="display:none" onchange="importBackup(this)"/>
      </label>
    </div>
  </div>
  <div style="padding:16px">
    ${cf?`<div style="display:flex;align-items:center;gap:8px;margin-bottom:14px">
      <div style="font-size:12px;font-weight:700;color:#1B4332;background:#D1FAE5;border-radius:20px;padding:4px 12px">📍 ${cidNome}</div>
      <button onclick="G.cidFiltro=null;render()" style="background:none;border:none;font-size:12px;color:#9CA3AF;cursor:pointer">✕ Ver todas</button>
    </div>`:''}
    <div style="font-size:11px;font-weight:800;color:#6B7280;letter-spacing:1px;margin-bottom:14px">${cf?`VISTORIAS DE ${cidNome?.toUpperCase()} (${lista.length})`:`VISTORIAS REALIZADAS (${hist.length})`}</div>
    ${lista.length?rows:`<div style="padding:40px;text-align:center;color:#9CA3AF">
      <div style="font-size:40px;margin-bottom:10px">📁</div>
      <div style="font-size:16px;font-weight:700">Nenhuma vistoria ${cf?'para '+cidNome:'realizada'}</div>
      <div style="font-size:13px;margin-top:6px">As vistorias concluídas aparecerão aqui</div>
    </div>`}
  </div></div>`;
}
